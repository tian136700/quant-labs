<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>卡片：单词原样 + 词性旁读音横线</title>
  <style>
    :root { --bg:#1a1d24; --fg:#f2f4f8; --muted:#9aa3b2; --rise:#e85d6f; --border:#3a4150; --card:#232833; }
    body { margin:0; font-family:"Hiragino Sans","PingFang SC",sans-serif; background:var(--bg); color:var(--fg); padding:2rem; }
    .note { color:var(--muted); font-size:.9rem; max-width:42rem; line-height:1.55; }
    .card { margin-top:1.25rem; padding:1.25rem 1.5rem; background:var(--card); border:1px solid var(--border); border-radius:14px; max-width:28rem; }
    .word-row { font-size:2rem; font-weight:700; text-align:center; }
    .label { color:var(--muted); margin-right:.35rem; font-size:1.2rem; }
    .info { margin-top:1rem; padding:1rem; border:1px solid var(--border); border-radius:12px; }
    .row { display:grid; grid-template-columns:auto 1fr; gap:.35rem .75rem; align-items:center; margin:.4rem 0; }
    .pos { display:inline-block; padding:.1rem .45rem; border-radius:999px; border:1px solid var(--border); font-size:.8125rem; color:var(--muted); }
    .pos-reading { display:flex; flex-wrap:wrap; align-items:center; gap:.55rem .85rem; }
    .pitch { display:inline-flex; color:var(--muted); font-size:1.2rem; font-weight:600; letter-spacing:.04em; }
    .mora { display:inline-block; min-width:1.05em; text-align:center; padding-top:.22em; }
    .mora-h { border-top:2px solid currentColor; }
    .ok { color:#3fb983; margin-top:1rem; }
  </style>
</head>
<body>
  <h1>真实卡片布局样例</h1>
  <p class="note">顶部「单词」必须是 イギリス。读音+横线在「词性」同一行右侧：名词 + いぎりす。</p>
  <div class="card">
    <div class="word-row"><span class="label">单词：</span><span id="word">イギリス</span></div>
    <div class="info">
      <div class="row"><span>释义：</span><span>英国</span></div>
      <div class="row">
        <span>词性：</span>
        <div class="pos-reading">
          <span class="pos">名词</span>
          <span class="pitch" id="reading"></span>
        </div>
      </div>
    </div>
    <p class="ok" id="result"></p>
  </div>
  <script>
    const moras=[{c:"い",p:"L"},{c:"ぎ",p:"H"},{c:"り",p:"H"},{c:"す",p:"H"}];
    const el=document.getElementById("reading");
    for(const m of moras){
      const s=document.createElement("span");
      s.className="mora"+(m.p==="H"?" mora-h":"");
      s.textContent=m.c; el.appendChild(s);
    }
    const ok=document.getElementById("word").textContent==="イギリス";
    document.getElementById("result").textContent=ok?"通过：顶部片假名原样；词性旁平假名+横线":"失败";
  </script>
</body>
</html>
