  <script>
    (function () {
      var bar = document.getElementById("reading-progress");
      var content = document.getElementById("content-area");
      if (!bar) return;

      function updateProgress() {
        var el = content || document.documentElement;
        var rect = el.getBoundingClientRect();
        var elTop = rect.top + window.scrollY;
        var elHeight = el.offsetHeight || el.scrollHeight;
        var viewHeight = window.innerHeight;
        var scrollTop = window.scrollY;
        var start = elTop;
        var end = elTop + elHeight - viewHeight;
        var pct = 0;

        if (end <= start) {
          pct = scrollTop >= start ? 100 : 0;
        } else {
          pct = ((scrollTop - start) / (end - start)) * 100;
        }

        pct = Math.min(100, Math.max(0, pct));
        bar.style.width = pct + "%";
        bar.setAttribute("aria-valuenow", String(Math.round(pct)));
      }

      window.addEventListener("scroll", updateProgress, { passive: true });
      window.addEventListener("resize", updateProgress, { passive: true });
      updateProgress();
    })();
  </script>
