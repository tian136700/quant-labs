# Cloudflare Pages / Workers 配置
# 部署前请在 Cloudflare Dashboard 创建 D1 数据库，并将下方 database_id 替换为真实 ID
name = "strategy-compare-cloud"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "strategy-compare-db"
database_id = "fd580cfa-ba64-4f04-9a96-d49c621ef84b"

[vars]
RSI_PERIOD = "6"
PRICE_DECIMAL_PLACES = "3"
