# Cloudflare Workers + OpenNext 配置
# database_id 请替换为你在 Dashboard 创建的 D1 真实 ID
# 与 Cloudflare 上已有 Worker / 域名绑定一致，避免每次 deploy 询问是否改绑 finance.info-quests.com
name = "quant-labs"
# Custom Worker：OpenNext fetch + Cron scheduled（上课 Bark 提醒）
main = "cloudflare-worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 每分钟：开课前 10/5/1 分钟 Bark（Mac 关机也能推）
[triggers]
crons = ["* * * * *"]

# 自动将 Worker 部署在离 D1/R2 等后端更近的节点，降低数据库往返延迟
[placement]
mode = "smart"

# 自定义域名须与 wrangler deploy 同步，否则 finance 可能仍跑旧版本
[[routes]]
pattern = "finance.info-quests.com"
custom_domain = true

[[routes]]
pattern = "blog.info-quests.com"
custom_domain = true

# 日语模块对外分享（与 finance 同一 Worker；路径仍为 /jp-lesson、/jp-vocab、/jp-review）
[[routes]]
pattern = "japanese.info-quests.com"
custom_domain = true

# 英语模块对外分享（与 finance / japanese 同一 Worker；路径仍为 /en-lesson、/en-vocab）
[[routes]]
pattern = "english.info-quests.com"
custom_domain = true

# 在线工具：暂用 finance 路径 /tool-dot，子域名以后再说
# [[routes]]
# pattern = "tool.info-quests.com"
# custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "strategy-compare-db"
database_id = "fd580cfa-ba64-4f04-9a96-d49c621ef84b"

# 日语口语复习 PDF（Mac 定时上传 → R2 → /jp-review 下载）
# 首次使用：Dashboard 启用 R2 → npx wrangler r2 bucket create jp-review
[[r2_buckets]]
binding = "JP_REVIEW"
bucket_name = "jp-review"

[vars]
RSI_PERIOD = "6"
PRICE_DECIMAL_PLACES = "3"
# 外卖平台独立子域名（不含 https://），绑定 Custom Domain 后填真实值
NEXT_PUBLIC_STORE_REVIEW_HOST = "food.info-quests.com"
NEXT_PUBLIC_STORE_REVIEW_SITE_URL = "https://food.info-quests.com"
# AI Trend Digest 博客子域名（与 finance 一样：wrangler deploy 自动绑 Custom Domain）
NEXT_PUBLIC_TREND_BLOG_HOST = "blog.info-quests.com"
NEXT_PUBLIC_TREND_BLOG_SITE_URL = "https://blog.info-quests.com"
# 日语模块对外分享与登录链接（勿用 finance 域名发给老师）
NEXT_PUBLIC_JP_SITE_HOST = "japanese.info-quests.com"
NEXT_PUBLIC_JP_SITE_URL = "https://japanese.info-quests.com"
# 英语模块对外分享与登录链接（英文老师用 english，勿用 japanese / finance）
NEXT_PUBLIC_EN_SITE_HOST = "english.info-quests.com"
NEXT_PUBLIC_EN_SITE_URL = "https://english.info-quests.com"
# 登录 Cookie 共享到所有 *.info-quests.com 子域名
ETR_COOKIE_DOMAIN = ".info-quests.com"
# 全站维护模式：MAINTENANCE_MODE="1" 正常；"0" 进入维护
# 部署后可在 Dashboard → Workers → quant-labs → Settings → Variables 中在线调整
MAINTENANCE_MODE = "1"
# Google Search Console HTML 验证（填 meta content 值，部署后回 GSC 点「验证」）
# FOOD_GOOGLE_SITE_VERIFICATION = "在这里粘贴 Google 给你的验证码"
# BLOG_GOOGLE_SITE_VERIFICATION = "blog 子域名验证码（也可 DNS 验证 blog.info-quests.com）"
